<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Losers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Section de connexion et création de compte -->
    <div id="login-section">
        <h2>Connexion</h2>
        <form id="login-form">
            <input type="text" id="pseudo" placeholder="Pseudo" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <button id="create-account">Créer un compte</button>
    </div>

    <!-- Section principale après connexion (initialement cachée) -->
    <div id="main-section" style="display: none;">
        <h2>Bienvenue, <span id="welcome-message"></span>!</h2>
        <button id="new-lose">New Lose</button>
        <button id="hall-of-lose">Hall of Lose</button>
        <button id="stats-of-lose">Stats of Lose</button>
        <button id="logout">Se déconnecter</button>
    </div>

    <!-- Formulaire New Lose (initialement caché) -->
    <div id="new-lose-form" style="display: none;">
        <h2>Nouvelle Perte</h2>
        <form id="new-lose-data-form">
            <input type="date" id="match-date" required>
            <input type="text" id="winner1" placeholder="Winner1" required>
            <input type="text" id="winner2" placeholder="Winner2" required>
            <input type="text" id="loser1" placeholder="Loser1" required>
            <input type="text" id="loser2" placeholder="Loser2" required>
            <button type="submit">Sauvegarder</button>
        </form>
        <button id="cancel-new-lose">Annuler</button>
    </div>

    <!-- Scripts Firebase compatibles avec les navigateurs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
