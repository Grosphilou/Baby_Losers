<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Losers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Baby Losers</h1>
        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <button type="button" id="create-account">Create Account</button>
            </form>
        </div>
        <div id="main-section" style="display: none;">
            <button id="new-lose">New Lose</button>
            <button id="hall-of-lose">Hall of Lose</button>
            <button id="stats-of-lose">Stats of Lose</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
