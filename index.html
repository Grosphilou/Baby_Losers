<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Losers</title>
    <!-- Ajoutez vos liens CSS ici -->
</head>
<body>
    <div id="main-page">
        <button id="create-account">Créer un compte</button>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <button id="new-loose-btn">New Lose</button>
    </div>

    <div id="form-new-loose" style="display: none;">
        <form id="loose-form">
            <input type="date" id="date" required>
            <input type="text" id="winner1" placeholder="Gagnant 1" required>
            <input type="text" id="winner2" placeholder="Gagnant 2" required>
            <input type="text" id="loser1" placeholder="Perdant 1" required>
            <input type="text" id="loser2" placeholder="Perdant 2" required>
            <button type="submit">Ajouter</button>
        </form>
    </div>

    <!-- Ajoutez vos scripts JS ici -->
    <script src="script.js"></script>
</body>
</html>
