<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Losers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <h1>Baby Losers</h1>
        
        <!-- Formulaire de nouvelle partie -->
        <button id="new-loose-btn">Nouvelle Partie</button>
        
        <div id="form-new-loose" class="form-container">
            <h2>Ajouter une nouvelle loose</h2>
            
            <!-- Formulaire avec la date et la liste des pseudos -->
            <form id="loose-form">
                <label for="date">Date :</label>
                <input type="date" id="date" name="date" required>
                
                <label for="winner1">Gagnant 1 :</label>
                <select id="winner1" name="winner1" required>
                    <option value="">Sélectionnez un gagnant</option>
                </select>

                <label for="winner2">Gagnant 2 :</label>
                <select id="winner2" name="winner2" required>
                    <option value="">Sélectionnez un gagnant</option>
                </select>

                <label for="loser1">Perdant 1 :</label>
                <select id="loser1" name="loser1" required>
                    <option value="">Sélectionnez un perdant</option>
                </select>

                <label for="loser2">Perdant 2 :</label>
                <select id="loser2" name="loser2" required>
                    <option value="">Sélectionnez un perdant</option>
                </select>

                <button type="submit">Soumettre</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
